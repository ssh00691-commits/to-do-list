<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>할 일</title>
  <style>
    /* 3단계에서 작성 */
  </style>
</head>
<body>
  <main>
    <h1>오늘 할 일</h1>

    <p id="remaining">남은 할 일 <span id="remaining-count">0</span>개</p>

    <form id="todo-form">
      <label for="todo-input">할 일 입력</label>
      <input id="todo-input" type="text" maxlength="100" placeholder="할 일을 입력하세요" autocomplete="off">
      <button type="submit">추가</button>
    </form>

    <ul id="todo-list"></ul>

    <p id="empty-message" hidden>할 일이 없어요. 하나 추가해 보세요.</p>
  </main>

  <script>
    const STORAGE_KEY = 'todo-app-items';

    const form = document.getElementById('todo-form');
    const input = document.getElementById('todo-input');
    const list = document.getElementById('todo-list');
    const countEl = document.getElementById('remaining-count');
    const emptyMessage = document.getElementById('empty-message');

    let todos = load();
    let composing = false;

    function load() {
      try {
        const data = JSON.parse(localStorage.getItem(STORAGE_KEY));
        if (!Array.isArray(data)) return [];
        return data.filter(t => t && typeof t.id === 'string' && typeof t.text === 'string')
                   .map(t => ({ id: t.id, text: t.text, done: t.done === true }));
      } catch (e) {
        return [];
      }
    }

    function save() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(todos));
      } catch (e) {
        // 저장 실패해도 앱은 계속 동작
      }
    }

    function render() {
      list.textContent = '';
      for (const todo of todos) {
        const li = document.createElement('li');
        li.dataset.id = todo.id;
        if (todo.done) li.classList.add('done');

        const checkbox = document.createElement('input');
        checkbox.type = 'checkbox';
        checkbox.checked = todo.done;
        checkbox.setAttribute('aria-label', '완료');

        const text = document.createElement('span');
        text.textContent = todo.text;

        const del = document.createElement('button');
        del.type = 'button';
        del.textContent = '×';
        del.setAttribute('aria-label', '삭제');

        li.append(checkbox, text, del);
        list.append(li);
      }
      countEl.textContent = todos.filter(t => !t.done).length;
      emptyMessage.hidden = todos.length > 0;
    }

    function addTodo() {
      const text = input.value.trim();
      if (!text) {
        input.focus();
        return;
      }
      todos.push({ id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6), text, done: false });
      input.value = '';
      save();
      render();
      input.focus();
    }

    input.addEventListener('compositionstart', () => { composing = true; });
    input.addEventListener('compositionend', () => { composing = false; });

    form.addEventListener('submit', e => {
      e.preventDefault();
      if (composing || e.isComposing) return;
      addTodo();
    });

    // Enter는 form submit으로 처리되지만, IME 조합 확정 Enter는 걸러냄
    input.addEventListener('keydown', e => {
      if (e.key === 'Enter' && (e.isComposing || e.keyCode === 229)) e.preventDefault();
    });

    list.addEventListener('click', e => {
      const li = e.target.closest('li');
      if (!li) return;
      const todo = todos.find(t => t.id === li.dataset.id);
      if (!todo) return;

      if (e.target.tagName === 'BUTTON') {
        todos = todos.filter(t => t !== todo);
      } else if (e.target.tagName === 'INPUT' || e.target.tagName === 'SPAN') {
        // 체크박스 클릭은 이미 checked가 바뀐 상태, 텍스트 클릭은 직접 반전
        todo.done = e.target.tagName === 'INPUT' ? e.target.checked : !todo.done;
      } else {
        return;
      }
      save();
      render();
    });

    render();
  </script>
</body>
</html>
